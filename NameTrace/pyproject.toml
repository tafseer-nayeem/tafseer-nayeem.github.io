[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nametrace"
version = "0.1.0"
description = "Code for name-surface support analysis"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "transformers>=4.45",
    "torch>=2.3",
    "pyyaml>=6.0",
    "huggingface_hub>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]
